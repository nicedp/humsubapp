# ─────────────────────────────────────────────────────────────────────────────
# Society Management Portal — Production Docker Compose
#
# Usage:
#   1. Copy and fill env files:
#        cp backend/.env.example backend/.env.prod
#        cp frontend/.env.example frontend/.env.prod
#   2. Set your domain in nginx/nginx.conf (replace "yourdomain.com")
#   3. Provision TLS certs (see DEPLOYMENT.md — SSL section)
#   4. Deploy:
#        docker compose -f docker-compose.prod.yml up -d --build
#
# Services:
#   db        — PostgreSQL 15 (no external port exposed in production)
#   backend   — Express API (compiled JS, non-root user)
#   frontend  — Vite-built React SPA served by nginx
#   nginx     — Reverse proxy handling SSL termination + routing
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: society_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-society_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-society_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do NOT expose port 5432 publicly in production.
    # Backend connects via the internal Docker network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-society_user} -d ${POSTGRES_DB:-society_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: society_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env.prod
    environment:
      # Override specific vars that depend on Docker-internal hostnames
      DATABASE_URL: postgresql://${POSTGRES_USER:-society_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-society_db}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - uploads_data:/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal

  # ── Frontend (static SPA via nginx) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # VITE_API_URL is baked into the JS bundle at build time.
        # Set to your public API URL (must match what the browser calls).
        # When using the nginx reverse proxy below, this is your domain /api path.
        VITE_API_URL: ${VITE_API_URL:-https://yourdomain.com}
    container_name: society_frontend
    restart: always
    expose:
      - "80"
    networks:
      - internal

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: society_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certificates — provisioned by Certbot or your CA
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot webroot for ACME challenges
      - certbot_www:/var/www/certbot:ro
    networks:
      - internal

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  certbot_www:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Society Management Portal — Production Reverse Proxy (nginx)
#
# Topology:
#   Internet → nginx (port 80/443)
#              ├── /api/*        → backend:3000  (Express API)
#              ├── /api-docs     → backend:3000  (Swagger UI)
#              └── /*            → frontend:80   (React SPA / nginx)
#
# SSL termination is handled here. Replace <yourdomain.com> with your domain
# and point the certificate paths to your actual certs (Certbot / Let's Encrypt).
#
# For HTTP-only (no SSL) or a setup behind a cloud load-balancer that already
# terminates TLS, use only the HTTP server block and remove the HTTPS block.
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstream definitions ───────────────────────────────────────────────────────
upstream backend_api {
    server backend:3000;
    keepalive 32;
}

upstream frontend_app {
    server frontend:80;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Allow Let's Encrypt ACME challenges through before redirecting
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── TLS certificates (Let's Encrypt / Certbot) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Client upload size limit (file uploads) ─────────────────────────────
    client_max_body_size 20M;

    # ── API proxy (/api/* → backend) ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Swagger API docs (/api-docs → backend) ──────────────────────────────
    location /api-docs {
        proxy_pass         http://backend_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Uploads proxy (/uploads → backend) ──────────────────────────────────
    location /uploads/ {
        proxy_pass         http://backend_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # ── Frontend SPA (everything else → frontend nginx) ─────────────────────
    location / {
        proxy_pass         http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ── HTTP-only fallback (for servers without SSL / behind a cloud LB) ──────────
